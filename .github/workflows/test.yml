# Run the full test suite on every push.
#
# The point is that the repo cannot sit silently red. Before this existed, the
# suite fired only when someone typed `make test` -- and it was once found
# broken on main, unnoticed, by someone chasing an unrelated bug.
name: tests

# `push` alone, and unscoped. It used to be `push` plus `pull_request`, which ran
# the suite twice per commit on a same-repo pull request; runs attach to a commit
# SHA, so the `push` run is already the check the pull request displays. Leaving
# it unscoped is what keeps a branch with no pull request open tested.
#
# Two costs, taken knowingly: a pull request from a fork gets no run at all, and
# a merge-only breakage is caught by the run on main just after the merge rather
# than before it. Restoring `pull_request` is the fix for either, if they bite.
on:
  push:

# One run per branch, not one per push -- a second push cancels the first run
# mid-flight rather than leaving it to burn.
#
# On main the key includes the SHA, so every landed commit gets its own group and
# none can cancel another. `cancel-in-progress: false` would not do this: a group
# holds only one pending run, so a third merge would cancel the second out of the
# queue and that commit would reach main untested.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name == 'main' && github.sha || github.ref_name }}
  cancel-in-progress: true

# Running tests needs nothing but the code.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # One version, and it is the one `pyproject.toml` advertises as its
      # floor. A matrix over 3.10/3.11 was the alternative; it was declined
      # because the repo has never run on either, and testing versions we do
      # not ship to is a cost without a claim behind it.
      #
      # To support an older interpreter, add it here *and* lower
      # `requires-python`. `tests/test_python_version_claims.py` fails if only
      # one of the two moves.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Go through the Makefile rather than restating its commands, so CI runs
      # exactly what a human runs locally and the two cannot drift apart.
      # `make install` is the editable install with the api and dev extras.
      - name: Install
        run: make install PYTHON=python

      # `make test` is the full suite -- no subset, no markers, no
      # continue-on-error.
      - name: Run tests
        run: make test PYTHON=python
