# Run the full test suite on every push and every pull request.
#
# The point is that the repo cannot sit silently red. Before this existed, the
# suite fired only when someone typed `make test` -- and it was once found
# broken on main, unnoticed, by someone chasing an unrelated bug.
name: tests

on:
  push:
  pull_request:

# Running tests needs nothing but the code.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Go through the Makefile rather than restating its commands, so CI runs
      # exactly what a human runs locally and the two cannot drift apart.
      # `make install` is the editable install with the api and dev extras.
      - name: Install
        run: make install PYTHON=python

      # `make test` is the full suite -- no subset, no markers, no
      # continue-on-error.
      - name: Run tests
        run: make test PYTHON=python
