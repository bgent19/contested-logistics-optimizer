[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clopt"
version = "0.1.0"
description = "Contested-Logistics Routing Optimizer: risk-weighted min-cost-flow resupply planning."
readme = "README.md"
# 3.12 is not an aspiration -- it is the only interpreter this repo runs on.
# CI runs 3.12, the Dockerfile builds on `python:3.12-slim`, and that is the
# runtime students get. This once read ">=3.10", which nothing ever verified;
# a support claim nobody checks is worse than a narrower one that is true.
#
# One input was NOT checked when this was decided: what Python the lab
# machines and student laptops actually have. The call was made on the repo
# side alone (3.12 is what CI and the image run, and 3.10 is end-of-life in
# October 2026). If a student turns up on 3.11, that is the evidence this
# decision lacked -- widen it rather than working around it.
#
# Widening this is a real option, not a forbidden one -- but widening it alone
# is not. `tests/test_python_version_claims.py` fails until the workflow runs
# the new floor too, so the claim and the evidence move together.
requires-python = ">=3.12"

# Kept in step with the workflow by `test_classifiers_match_the_versions_ci_runs`.
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
]
license = { text = "MIT" }
authors = [{ name = "Brett G" }]
keywords = ["operations-research", "min-cost-flow", "logistics", "routing", "optimization"]

# The algorithmic core and CLI depend only on the standard library.
dependencies = []

[project.optional-dependencies]
# Only needed for the REST API surface.
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "pydantic>=2"]
# Developer / test tooling.
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
clopt = "clopt.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

# The teaching frontend ships INSIDE the installed package, so `pip install` of
# this repo gets it with no separate step and `make api` stays the only command.
# Without this the wheel carries the Python and silently omits `web/`, and the
# failure appears as a 404 at `/` on a machine that was installed from a wheel
# rather than in editable mode -- which is to say, on the teaching laptop and
# never on the developer's.
[tool.setuptools.package-data]
clopt = ["web/*.html", "web/*.css", "web/*.js"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# Print the reason for every skip. A skipped test is a check that did not run,
# and under `-q` alone it shows as a bare `s` -- which is how a dataset with no
# authored coordinates would look exactly like a dataset that was verified.
addopts = ["-rs"]
