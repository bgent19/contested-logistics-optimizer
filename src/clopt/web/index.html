<!DOCTYPE html>
<!--
  The classroom teaching frontend.

  Zero dependencies: hand-written SVG, native ES modules, no build step, no npm,
  no CDN, no web fonts, no vendored library. The usual reason to reach for a
  graph library is layout, and layout here is already solved by authored-and-
  frozen coordinates in `data/*.json` -- what remains is drawing circles, lines
  and text at coordinates already in hand.

  Edit-loop note: uvicorn's `--reload` does not watch static files, so a change
  to anything in this directory needs a hard refresh, not a server restart.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contested-Logistics Theater</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <div id="canvas">
      <!--
        One <svg>, one fixed viewBox, uniform scale. The x origin is negative to
        leave room for the derived super-source pinned outside the authored
        coordinate range. Everything inside is authored in diagram units and
        scales together, which is what makes a gutter that clears at authoring
        time clear at every projector size.
      -->
      <svg id="theater" viewBox="-60 0 1060 720"
           preserveAspectRatio="xMidYMid meet"
           xmlns="http://www.w3.org/2000/svg">
        <defs>
          <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5"
                  markerWidth="5" markerHeight="5" orient="auto-start-reverse">
            <path d="M0,1 L10,5 L0,9 z" fill="context-stroke"/>
          </marker>
          <!--
            The promoted reverse arc's head. Hollow rather than filled, which is
            one of the three non-colour channels the promotion spends: colour
            was never available to it, since path-vs-lane is dE 66 normally and
            3.1 under achromatopsia. An outline survives greyscale, a hue does
            not.

            Its own marker rather than a variant of the one above, because a
            marker cannot be restyled from the element that wears it --
            `context-stroke` reaches the stroke, and there is no equivalent that
            would let one path be filled here and hollow there.

            The outline's weight is a token in style.css like every other
            weight on the page: a stroke width written here would be the one
            appearance value a projector retune could not reach.
          -->
          <marker id="arrowhead-hollow" viewBox="0 0 12 12" refX="10" refY="6"
                  markerWidth="5" markerHeight="5" orient="auto-start-reverse">
            <path d="M1,1.5 L11,6 L1,10.5 z"/>
          </marker>
        </defs>

        <!--
          Paint order is tiered, and the tiering is a rule: the annotation tier
          always paints over the lane tier, and ordering *within* a tier is
          arbitrary. Stated here so nobody later tidies these four groups into
          one flat list. The JSON edges array is already load-bearing for two
          separate reasons; paint order is deliberately not a third, because two
          bare lanes are the same hue and weight and which is on top is not a
          fact about the graph.
        -->
        <g id="tier-lanes"></g>
        <g id="tier-nodes"></g>
        <g id="tier-annotation"></g>
      </svg>
    </div>

    <aside id="panel">
      <h1 id="scenario-name">&nbsp;</h1>
      <p class="subtitle" id="scenario-description">&nbsp;</p>

      <!--
        The headline. Its cells are built by graph.js in the topology pass and
        thereafter written only through textContent, so the slot a number sits
        in is fixed for the whole unit: a value the instructor read on the last
        beat is in the same place on this one.
      -->
      <div id="headline">
        <div id="headline-stats"></div>
        <p id="headline-delta"></p>
        <!--
          One sentence, and the slot a degenerate view x dataset combination
          speaks through. A combination is LABELLED, not struck: striking one
          would be view-aware behaviour, which is the hidden modality the key
          assignments were designed to avoid.
        -->
        <p id="headline-note"></p>
        <!--
          The active threat picture's caption: its name, and the instructor's
          own note on each disruption it applies. A slot of its own rather than
          a share of the sentence above, because both can be true at once -- the
          textbook set in Cost & Risk has a flat frontier to declare AND no
          threat picture to cycle -- and because these are the instructor's
          words rather than the page's.
        -->
        <p id="threat-note"></p>
      </div>

      <h2>Dataset</h2>
      <div class="controls">
        <select id="dataset-select" aria-label="Dataset"></select>
      </div>

      <h2>View</h2>
      <div class="controls" id="view-controls"></div>

      <h2>Layers</h2>
      <div class="controls" id="layer-controls"></div>

      <h2>Beats</h2>
      <!--
        The beat timeline. A fixed slot like the rest of the panel, populated by
        whichever view owns a spine and holding a single row for the views that
        do not yet -- an empty slot in the place the rows would be is cheaper to
        read past than a panel that reshapes itself between views.

        The rows are built by graph.js on every spine install rather than once
        per dataset: a spine's length moves whenever the view, the dataset or
        the threat picture does. Clicking a row jumps to that beat, which is a
        pointer action duplicating a keyboard one and reaching nothing the
        keyboard cannot.
      -->
      <ol id="timeline"></ol>

      <h2>Frontier</h2>
      <!--
        The Pareto table: one row per lambda, always, all eight of them.

        It is the Cost & Risk view's PROMOTED TIMELINE -- its rows carry that
        view's beat state and a click on one jumps to that detent, which is why
        the beat timeline above is empty while Cost & Risk is up. Keeping all
        eight rows with the collapsed ones marked is what lets the instructor
        say "the frontier has four points, not eight; lambda is a dial with
        detents" and then point at the duplicates.

        A fixed slot like the rest of the panel: it is built per dataset because
        the frontier is a property of the dataset, and the other two views
        simply leave it unmarked rather than emptying it.
      -->
      <table id="pareto">
        <colgroup id="pareto-cols"></colgroup>
        <thead id="pareto-head"></thead>
        <tbody id="pareto-rows"></tbody>
      </table>

      <h2>Lanes</h2>
      <!--
        The lane ledger: one row per stored lane, always, in fixed order, so a
        lane's numbers are in the same place on every beat of all four days and
        can be read aloud without hunting. The columns, the frame and the rows
        are all built by graph.js in the same pass as the lanes, because a row
        and a lane are the same domain object -- which makes row-to-lane
        identity structural rather than a lookup.

        Clicking a row pins that lane hot until the next beat or `R`. That is
        the whole of what a pointer may do here: duplicate a keyboard jump, or
        produce transient emphasis no later state depends on.
      -->
      <table id="ledger">
        <colgroup id="ledger-cols"></colgroup>
        <thead id="ledger-head"></thead>
        <tbody id="ledger-rows"></tbody>
      </table>
    </aside>
  </div>

  <!--
    Boot, inline and deliberately so. The module inventory is fixed at seven by
    the spec, and a `main.js` would be an eighth chosen by the implementer. This
    file already owns the view switcher, the layer toggles and the panel, so the
    handful of lines that wire those controls to the state mutators belong to
    it. Nothing here reaches for an endpoint or an appearance value: it fetches
    through api.js, mutates through state.js, and repaints through render.js.
  -->
  <script type="module">
    import { fetchDatasets, fetchScenario, fetchMaxflow,
             fetchLadder, fetchSweep, fetchNaive } from "./api.js";
    import { state, setScenario, setDataset, setDatasets, setView, toggleLayer,
             pinLane, stepBeat, stepUnit, jumpToUnit, resetView, setBeat,
             setSpine, flowCutSpine, interdictionSpine, costRiskSpine,
             paretoRows, spine, resolveBeat, threatNames, cycleThreat,
             nextDataset, stashThreat, restoreThreat } from "./state.js";
    import { buildGraph, buildTimeline, buildPareto, laneForArc } from "./graph.js";
    import { render } from "./render.js";
    import { VIEWS, LAYERS, applyLayerClasses, viewForKey,
             showsTimeline } from "./views.js";

    const svg = document.getElementById("theater");
    const select = document.getElementById("dataset-select");

    // The key the baseline's payloads are filed under. A map key rather than
    // `null` so that the pristine network and the pictures are looked up the
    // same way, with no branch deciding which store to reach into.
    const BASELINE = "";

    // Every threat state's four payloads, keyed by picture name.
    //
    // PREFETCHED WITH THE DATASET, all of them, because `T` is a keypress and
    // the rule this whole application is built on is that anything a keypress
    // can reach is fetched before the first keypress. A `T` that fetched would
    // be a request that can fail while the room watches, and the spine it
    // installs would arrive after the key that asked for it. The cost is
    // (pictures + 1) x 4 requests on a dataset switch, paid once, off the
    // classroom's critical path -- against a request in the middle of a
    // sentence, paid every time the instructor makes the comparison the key
    // exists for.
    let payloads = new Map();

    // The rows a slot shows for a view that does not own it, as ONE array
    // rather than a fresh `[]` each pass. The identity checks below are what
    // keep a repaint from rebuilding rows the pointer may be over, and a new
    // empty array every time would defeat them.
    const NO_ROWS = [];

    // This dataset's frontier, as `paretoRows` tagged it. Held here so the
    // Pareto table can be built PER VIEW like the beat timeline while being
    // computed once per dataset like the ledger -- the frontier is a fact about
    // the dataset, but the rows are only on screen in the view whose beat state
    // they carry.
    let frontier = NO_ROWS;

    // The spine whose rows are currently in the timeline. Compared by identity
    // rather than by length: a spine array is replaced wholesale when one is
    // installed and when the view switches, and never mutated in place, so
    // identity is exactly the question "are these the rows on screen?".
    let drawnSpine = null;

    // The same identity guard for the Pareto table's rows.
    let drawnPareto = null;

    function repaint() {
      // Rebuilt only when the spine itself changed, so stepping through a beat
      // is class writes on rows that already exist. Rebuilding every keypress
      // would work and would throw away the row the pointer is over.
      // Whether this view owns the beat timeline is a property of the view,
      // read from the catalog rather than branched on by id here. Cost & Risk
      // says no because its Pareto table already carries the beat state --
      // see the note on that view in views.js before "fixing" the empty slot.
      const active = showsTimeline(state.view) ? spine() : NO_ROWS;
      if (active !== drawnSpine) {
        buildTimeline(active);
        drawnSpine = active;
      }
      // The other half of the same swap: the two slots are never both filled,
      // because they carry the same thing -- this view's beat state -- and the
      // whole reason the timeline is empty in Cost & Risk is that the Pareto
      // table is saying it instead. An inert copy of the frontier left standing
      // in Flow & Cut would be a table the pointer cannot use, under a heading
      // claiming otherwise.
      const rows = showsTimeline(state.view) ? NO_ROWS : frontier;
      if (rows !== drawnPareto) {
        buildPareto(rows);
        drawnPareto = rows;
      }
      applyLayerClasses(document.documentElement, state.layers);
      render(state);
      // The controls follow the state rather than driving it, so a beat that
      // overrides a layer lights the same button a click on it would have.
      syncControls();
    }

    function buildControls() {
      const views = document.getElementById("view-controls");
      for (const view of VIEWS) {
        const button = document.createElement("button");
        button.textContent = view.label;
        button.title = view.hint;
        button.dataset.view = view.id;
        button.addEventListener("click", () => {
          setView(view.id);
          repaint();
        });
        views.appendChild(button);
      }

      const layers = document.getElementById("layer-controls");
      for (const layer of LAYERS) {
        const button = document.createElement("button");
        button.textContent = layer.label;
        button.title = layer.hint;
        button.dataset.layer = layer.id;
        button.addEventListener("click", () => {
          toggleLayer(layer.id);
          repaint();
        });
        layers.appendChild(button);
      }
    }

    /* One delegated listener on the tbody rather than one per row: the rows are
     * rebuilt per dataset, and a listener attached per row would have to be
     * attached from the build pass, putting behaviour in the module that owns
     * structure. */
    function bindLedger() {
      document.getElementById("ledger-rows").addEventListener("click", (event) => {
        const row = event.target.closest("tr[data-edge]");
        if (!row) return;
        pinLane(row.dataset.edge);
        repaint();
      });
    }

    /* The timeline's rows, delegated for the same reason the ledger's are: the
     * rows are rebuilt whenever the spine changes, and a per-row listener would
     * have to be attached from the build pass.
     *
     * A row click is a jump to that beat -- a pointer action that duplicates a
     * keyboard one exactly. It reaches no state the keyboard cannot, which is
     * the rule every pointer action on this page lives under. */
    function bindTimeline() {
      document.getElementById("timeline").addEventListener("click", (event) => {
        const row = event.target.closest("li[data-beat]");
        if (!row) return;
        setBeat(Number(row.dataset.beat));
        repaint();
      });
    }

    /* The Pareto table's rows, delegated exactly as the timeline's are, and for
     * the same reason: the rows are rebuilt per dataset, and a per-row listener
     * would have to be attached from the build pass.
     *
     * This table IS the Cost & Risk view's timeline, so a row click is a jump
     * to that detent -- the same pointer action a timeline row performs, and
     * one that reaches no state the keyboard cannot. A collapsed lambda's row
     * lands on the detent it belongs to, which is the honest answer: the row is
     * on screen so it can be pointed at, and pointing at it should show the
     * plan it shares. */
    function bindPareto() {
      document.getElementById("pareto-rows").addEventListener("click", (event) => {
        const row = event.target.closest("tr[data-unit]");
        if (!row) return;
        // Only while this table IS the current view's timeline. The frontier is
        // a fact about the dataset, so the table stays populated in all three
        // views -- but a click in Flow & Cut would otherwise index THAT view's
        // spine and silently jump the augmentation ladder to wherever detent
        // four happens to land. No keypress in Flow & Cut means "detent 4 of
        // Day 1", and a pointer may never reach what the keyboard cannot.
        if (showsTimeline(state.view)) return;
        // By ORDINAL, through the same mutator the digit keys use, so the row
        // and the digit cannot disagree about which beat a detent starts at.
        jumpToUnit(Number(row.dataset.unit));
        repaint();
      });
    }

    /* The keyboard, which is the primary driver -- on-screen controls are
     * pointer parity and never the other way round.
     *
     * ONE TABLE, and it is one table so that the pointer-only rule for layers
     * is checkable rather than merely agreed: `tests/test_web_assets.py` reads
     * this block and fails if a layer id or `toggleLayer` appears in it. The
     * keys stay reserved for the controls used mid-narration.
     *
     * `event.code` rather than `event.key` throughout. The view jumps were
     * chosen for being bottom-row, one-handed and modifier-free, which is a
     * fact about where the key IS -- a layout that prints something else on the
     * cap should still drive the tool.
     *
     * `PageDown` steps FORWARD and `PageUp` back, which is the way round a
     * presenter remote sends them -- the alias exists so a remote drives the
     * tool with no configuration, so the remote decides the direction, not the
     * order the two keys are written down in.
     *
     * `ArrowDown` walks to the next coarse unit and `ArrowUp` to the previous
     * one, matching every other transport control: down the list is forward. */
    const KEY_ACTIONS = {
      ArrowRight: () => stepBeat(1),
      ArrowLeft:  () => stepBeat(-1),
      PageDown:   () => stepBeat(1),
      PageUp:     () => stepBeat(-1),
      ArrowDown:  () => stepUnit(1),
      ArrowUp:    () => stepUnit(-1),
      KeyR:       () => resetToBaseline(),
      // The two cycling axes, both of which PRESERVE THE BEAT INDEX -- park on
      // a detent, cycle the picture, and watch the same plan buckle. `T` is
      // synchronous because every picture's payloads were prefetched with the
      // dataset; `D` is the one key that awaits, and it is also the one
      // structural rebuild the architecture allows.
      KeyT:       () => { cycleThreat() && applyThreat(); },
      KeyD:       () => { cycleDataset(); },
    };

    const DIGIT = /^Digit([1-9])$/;

    function bindKeys() {
      window.addEventListener("keydown", (event) => {
        // Modified keystrokes belong to the browser. Taking Ctrl-R would cost
        // the instructor the reload that recovers from anything this page gets
        // wrong, in exchange for a key `R` already provides.
        if (event.ctrlKey || event.metaKey || event.altKey) return;
        if (event.target.matches("input, select, textarea")) return;

        const digit = DIGIT.exec(event.code);
        const view = viewForKey(event.code);
        const action = KEY_ACTIONS[event.code];
        // Digits jump straight to a coarse unit, 1-based as the instructor says
        // it out loud. A digit above the view's unit count is a silent no-op --
        // the mutators decline it rather than clamping, because a clamp moves
        // the picture somewhere nobody asked for, mid-sentence.
        if (digit) jumpToUnit(Number(digit[1]));
        else if (view) setView(view);
        else if (action) action();
        else return;

        // Only after the key is one of ours: the arrows and the page keys
        // otherwise scroll the panel out from under the instructor.
        event.preventDefault();
        repaint();
      });
    }

    function syncControls() {
      for (const button of document.querySelectorAll("[data-view]")) {
        button.setAttribute("aria-pressed", String(button.dataset.view === state.view));
      }
      for (const button of document.querySelectorAll("[data-layer]")) {
        button.setAttribute("aria-pressed", String(state.layers.has(button.dataset.layer)));
      }
    }

    /* Install the three spines built from the active picture's payloads.
     *
     * ONE function, called by the dataset load and by `T` alike, so the picture
     * the keyboard reaches and the one the first paint shows cannot be built
     * differently. Synchronous by construction: the payloads are already in
     * hand, and every spine builder is pure.
     *
     * **The topology pass does not run here, and must not.** The diagram is
     * built once per dataset, so a threat picture only ever changes classes and
     * text on the lanes and nodes that already exist -- rebuilding them would
     * throw away every handle the render pass reaches a lane through, and the
     * two would only be seen to disagree once some state was set, which is to
     * say in front of a room.
     *
     * ONE structural change does follow, and it is accepted rather than
     * overlooked: `repaint` rebuilds the beat timeline's rows, because the
     * spines installed here are new arrays. That is not the topology pass and
     * it is not avoidable -- a picture genuinely changes how long the story is
     * (the theater's ladder is three rungs pristine and two under
     * `strait_mined`), so rows have to appear or go. It is exactly the same
     * reason `setSpine` clamps the beat index rather than trusting it, and the
     * rows are the one thing on the page whose count is allowed to move. The
     * identity guard in `repaint` is what keeps it to spine changes alone,
     * rather than every keypress.
     */
    function applyThreat() {
      const built = payloads.get(state.threat || BASELINE);
      // A picture with no payloads is a dataset switch that has not finished.
      // Leaving the spines standing is the safe half: they are the last
      // complete set, rather than a half-installed ladder.
      if (!built) return;
      setSpine("flow-cut", flowCutSpine(built.maxflow, laneForArc));
      setSpine("interdiction",
               interdictionSpine(built.ladder, built.maxflow, laneForArc));
      setSpine("cost-risk", costRiskSpine(built.sweep, built.naive, laneForArc,
                                          state.scenario.network));
      // Rebuilt with the spine it was built beside: the frontier is a fact
      // about the dataset UNDER A PICTURE, and a mined strait moves it.
      frontier = paretoRows(built.sweep, built.naive);
    }

    /* `R`: the full reset, finished.
     *
     * `resetView` clears the threat picture along with the beat and the hand
     * toggles, which leaves the spines on screen built from the picture it just
     * dropped -- a panel captioned pristine over a disrupted ladder. Re-applying
     * is the other half of the reset, and it is a NAMED function rather than two
     * calls inline so that there is one spelling of "reset" for any later
     * control to reach for. `resetView` alone is never the whole act.
     */
    function resetToBaseline() {
      resetView();
      applyThreat();
    }

    /* `D`: the next dataset, carrying what the target can express.
     *
     * Through the same `load` the first paint uses, rather than a second build
     * path that can drift from it. The beat index carries across and is clamped
     * by `setSpine`; the picture is stashed on the way out and restored on the
     * way back in, so the Day 2 excursion comes home to what it left.
     */
    async function cycleDataset() {
      const next = nextDataset();
      // One dataset is not a cycle. Silent rather than labelled, unlike `T`:
      // the menu beside the key is showing its own single entry, so the reason
      // is already on screen where the instructor is looking.
      if (next === null) return;
      await switchDataset(next);
    }

    /* Leave the current dataset for another, remembering the picture.
     *
     * THE ONE ROUTE, shared by the `D` key and the menu, because they are the
     * same act and a second spelling of it is one that can drift -- a menu
     * change that forgot the stash would silently lose the picture the key
     * would have remembered.
     *
     * Guarded against re-entry, which matters for exactly this key: `D` is
     * designed to be pressed twice in quick succession -- that is how the
     * instructor comes home at two datasets -- and `load` is a long await that
     * rebuilds the diagram and replaces the payload store. Two of them
     * interleaved would build one dataset's DOM against another's payloads. A
     * dropped press is recoverable in a way that is not.
     */
    let switching = false;

    async function switchDataset(datasetId) {
      if (switching) return;
      switching = true;
      try {
        stashThreat();
        await load(datasetId);
        // The menu follows the state, like every other control on this page.
        select.value = datasetId;
      } finally {
        switching = false;
      }
    }

    async function load(datasetId) {
      const payload = await fetchScenario(datasetId);
      // Recorded here rather than only in the select's change handler, so the
      // field is true after the first load as well as after a switch.
      setDataset(datasetId);
      setScenario(payload);
      // Before anything is fetched with it: the picture is a parameter of all
      // four solver requests below, so restoring it afterwards would leave the
      // pristine network's spines under a panel captioned with a threat.
      restoreThreat();
      // The DOM is rebuilt exactly once per dataset, and never again for that
      // dataset. Every later state change is a render pass over elements that
      // already exist.
      buildGraph(svg, payload);
      document.getElementById("scenario-name").textContent = payload.name;
      document.getElementById("scenario-description").textContent = payload.description;

      // ANYTHING A KEYPRESS CAN REACH IS FETCHED BEFORE THE FIRST KEYPRESS.
      // The whole Edmonds-Karp trace arrives as one array on one request, so
      // stepping -- forwards or backwards, at speaking pace -- is an index
      // change and never a fetch. A beat that awaited anything could not be
      // synchronous, and a beat that is not synchronous cannot be stepped back
      // through while the room watches.
      //
      // Awaited before the spine is installed, and the spine is installed
      // complete or not at all: a half-built ladder is a keyboard that works
      // for three presses.
      //
      // Both spines' payloads are asked for together and awaited together. The
      // ladder is one request per threat state for the same reason the trace is:
      // Day 4 is walked up and back down at the front of the room, and the
      // alternative is the 2 x K requests a per-rung frontend would issue.
      //
      // Day 1's two arrays go in the same batch. They are a matched pair --
      // same lambda list, same order -- so the A/B flip between the naive plan
      // and the optimum is a swap at one index, and BOTH sides are in hand
      // before the dial can be turned. Fetching them per detent would put a
      // request between the instructor and the next keypress eight times over.
      //
      // And EVERY THREAT PICTURE'S SET, not only the active one, for the same
      // reason and one level up: `T` is a keypress too. The four requests are
      // issued once per threat state, all of them in flight together, and
      // nothing on the keyboard awaits anything afterwards.
      payloads = new Map();
      await Promise.all([null, ...threatNames()].map(async (name) => {
        const [maxflow, ladder, sweep, naive] = await Promise.all([
          fetchMaxflow(datasetId, name),
          fetchLadder(datasetId, name),
          fetchSweep(datasetId, name),
          fetchNaive(datasetId, name),
        ]);
        // Two payloads under `maxflow` and `ladder`, because Day 4 draws Day
        // 3's certificate underneath its own wreckage: the ladder says which
        // lanes the adversary takes and `/maxflow` says which lanes certify the
        // cut it is working against.
        payloads.set(name || BASELINE, { maxflow, ladder, sweep, naive });
      }));

      // The spines, and the Pareto rows beside them. The lane lookup is handed
      // in rather than imported by state.js, which keeps the module that owns
      // app state free of the one that owns elements.
      applyThreat();

      // The beat is re-resolved against the new dataset rather than reset: the
      // marks were cleared with the old theater's edge ids, and the current
      // beat is the only thing that knows what should be marked instead.
      resolveBeat();
      repaint();
    }

    async function boot() {
      const datasets = await fetchDatasets();
      // The cycle order is the server's -- default first, then alphabetical --
      // so `D` opens on the default and moves away from it.
      setDatasets(datasets.map((dataset) => dataset.id));
      for (const dataset of datasets) {
        const option = document.createElement("option");
        option.value = dataset.id;
        option.textContent = dataset.name;
        select.appendChild(option);
      }
      // Pointer parity with `D`, through the same function: the menu is not a
      // second route to a dataset switch, it is the same one named differently.
      select.addEventListener("change", () => switchDataset(select.value));

      buildControls();
      bindLedger();
      bindTimeline();
      bindPareto();
      setView(VIEWS[0].id);

      // An empty menu means the server loaded no dataset at all, which it
      // refuses to do -- so reaching here is a broken deployment, and it says
      // so rather than quietly requesting `/scenario` with no dataset and
      // drawing whatever the default happens to be.
      if (!datasets.length) throw new Error("/datasets returned nothing to draw");
      await load(datasets[0].id);

      // The keyboard goes live LAST, once a complete spine is installed.
      // Bound before the load, the arrows would be answerable during the fetch
      // -- landing on the one-beat fallback spine and doing nothing, which is
      // the one thing worse than a key that is not yet bound: a key that is
      // bound and silently declines. Anything a keypress can reach is fetched
      // before the first keypress, and this is where that becomes literal.
      bindKeys();
    }

    boot();
  </script>
</body>
</html>
