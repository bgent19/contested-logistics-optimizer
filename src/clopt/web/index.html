<!DOCTYPE html>
<!--
  The classroom teaching frontend.

  Zero dependencies: hand-written SVG, native ES modules, no build step, no npm,
  no CDN, no web fonts, no vendored library. The usual reason to reach for a
  graph library is layout, and layout here is already solved by authored-and-
  frozen coordinates in `data/*.json` -- what remains is drawing circles, lines
  and text at coordinates already in hand.

  Edit-loop note: uvicorn's `--reload` does not watch static files, so a change
  to anything in this directory needs a hard refresh, not a server restart.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contested-Logistics Theater</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <div id="canvas">
      <!--
        One <svg>, one fixed viewBox, uniform scale. The x origin is negative to
        leave room for the derived super-source pinned outside the authored
        coordinate range. Everything inside is authored in diagram units and
        scales together, which is what makes a gutter that clears at authoring
        time clear at every projector size.
      -->
      <svg id="theater" viewBox="-60 0 1060 720"
           preserveAspectRatio="xMidYMid meet"
           xmlns="http://www.w3.org/2000/svg">
        <defs>
          <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5"
                  markerWidth="5" markerHeight="5" orient="auto-start-reverse">
            <path d="M0,1 L10,5 L0,9 z" fill="context-stroke"/>
          </marker>
        </defs>

        <!--
          Paint order is tiered, and the tiering is a rule: the annotation tier
          always paints over the lane tier, and ordering *within* a tier is
          arbitrary. Stated here so nobody later tidies these four groups into
          one flat list. The JSON edges array is already load-bearing for two
          separate reasons; paint order is deliberately not a third, because two
          bare lanes are the same hue and weight and which is on top is not a
          fact about the graph.
        -->
        <g id="tier-lanes"></g>
        <g id="tier-nodes"></g>
        <g id="tier-annotation"></g>
      </svg>
    </div>

    <aside id="panel">
      <h1 id="scenario-name">&nbsp;</h1>
      <p class="subtitle" id="scenario-description">&nbsp;</p>

      <!--
        The headline. Its cells are built by graph.js in the topology pass and
        thereafter written only through textContent, so the slot a number sits
        in is fixed for the whole unit: a value the instructor read on the last
        beat is in the same place on this one.
      -->
      <div id="headline">
        <div id="headline-stats"></div>
        <p id="headline-delta"></p>
      </div>

      <h2>Dataset</h2>
      <div class="controls">
        <select id="dataset-select" aria-label="Dataset"></select>
      </div>

      <h2>View</h2>
      <div class="controls" id="view-controls"></div>

      <h2>Layers</h2>
      <div class="controls" id="layer-controls"></div>

      <h2>Lanes</h2>
      <!--
        The lane ledger: one row per stored lane, always, in fixed order, so a
        lane's numbers are in the same place on every beat of all four days and
        can be read aloud without hunting. The columns, the frame and the rows
        are all built by graph.js in the same pass as the lanes, because a row
        and a lane are the same domain object -- which makes row-to-lane
        identity structural rather than a lookup.

        Clicking a row pins that lane hot until the next beat or `R`. That is
        the whole of what a pointer may do here: duplicate a keyboard jump, or
        produce transient emphasis no later state depends on.
      -->
      <table id="ledger">
        <colgroup id="ledger-cols"></colgroup>
        <thead id="ledger-head"></thead>
        <tbody id="ledger-rows"></tbody>
      </table>
    </aside>
  </div>

  <!--
    Boot, inline and deliberately so. The module inventory is fixed at seven by
    the spec, and a `main.js` would be an eighth chosen by the implementer. This
    file already owns the view switcher, the layer toggles and the panel, so the
    handful of lines that wire those controls to the state mutators belong to
    it. Nothing here reaches for an endpoint or an appearance value: it fetches
    through api.js, mutates through state.js, and repaints through render.js.
  -->
  <script type="module">
    import { fetchDatasets, fetchScenario } from "./api.js";
    import { state, setScenario, setDataset, setView, toggleLayer, pinLane,
             stepBeat, stepUnit, jumpToUnit, resetView,
             resolveBeat } from "./state.js";
    import { buildGraph } from "./graph.js";
    import { render } from "./render.js";
    import { VIEWS, LAYERS, applyLayerClasses, viewForKey } from "./views.js";

    const svg = document.getElementById("theater");

    function repaint() {
      applyLayerClasses(document.documentElement, state.layers);
      render(state);
      // The controls follow the state rather than driving it, so a beat that
      // overrides a layer lights the same button a click on it would have.
      syncControls();
    }

    function buildControls() {
      const views = document.getElementById("view-controls");
      for (const view of VIEWS) {
        const button = document.createElement("button");
        button.textContent = view.label;
        button.title = view.hint;
        button.dataset.view = view.id;
        button.addEventListener("click", () => {
          setView(view.id);
          repaint();
        });
        views.appendChild(button);
      }

      const layers = document.getElementById("layer-controls");
      for (const layer of LAYERS) {
        const button = document.createElement("button");
        button.textContent = layer.label;
        button.title = layer.hint;
        button.dataset.layer = layer.id;
        button.addEventListener("click", () => {
          toggleLayer(layer.id);
          repaint();
        });
        layers.appendChild(button);
      }
    }

    /* One delegated listener on the tbody rather than one per row: the rows are
     * rebuilt per dataset, and a listener attached per row would have to be
     * attached from the build pass, putting behaviour in the module that owns
     * structure. */
    function bindLedger() {
      document.getElementById("ledger-rows").addEventListener("click", (event) => {
        const row = event.target.closest("tr[data-edge]");
        if (!row) return;
        pinLane(row.dataset.edge);
        repaint();
      });
    }

    /* The keyboard, which is the primary driver -- on-screen controls are
     * pointer parity and never the other way round.
     *
     * ONE TABLE, and it is one table so that the pointer-only rule for layers
     * is checkable rather than merely agreed: `tests/test_web_assets.py` reads
     * this block and fails if a layer id or `toggleLayer` appears in it. The
     * keys stay reserved for the controls used mid-narration.
     *
     * `event.code` rather than `event.key` throughout. The view jumps were
     * chosen for being bottom-row, one-handed and modifier-free, which is a
     * fact about where the key IS -- a layout that prints something else on the
     * cap should still drive the tool.
     *
     * `PageDown` steps FORWARD and `PageUp` back, which is the way round a
     * presenter remote sends them -- the alias exists so a remote drives the
     * tool with no configuration, so the remote decides the direction, not the
     * order the two keys are written down in.
     *
     * `ArrowDown` walks to the next coarse unit and `ArrowUp` to the previous
     * one, matching every other transport control: down the list is forward. */
    const KEY_ACTIONS = {
      ArrowRight: () => stepBeat(1),
      ArrowLeft:  () => stepBeat(-1),
      PageDown:   () => stepBeat(1),
      PageUp:     () => stepBeat(-1),
      ArrowDown:  () => stepUnit(1),
      ArrowUp:    () => stepUnit(-1),
      KeyR:       () => resetView(),
    };

    const DIGIT = /^Digit([1-9])$/;

    function bindKeys() {
      window.addEventListener("keydown", (event) => {
        // Modified keystrokes belong to the browser. Taking Ctrl-R would cost
        // the instructor the reload that recovers from anything this page gets
        // wrong, in exchange for a key `R` already provides.
        if (event.ctrlKey || event.metaKey || event.altKey) return;
        if (event.target.matches("input, select, textarea")) return;

        const digit = DIGIT.exec(event.code);
        const view = viewForKey(event.code);
        const action = KEY_ACTIONS[event.code];
        // Digits jump straight to a coarse unit, 1-based as the instructor says
        // it out loud. A digit above the view's unit count is a silent no-op --
        // the mutators decline it rather than clamping, because a clamp moves
        // the picture somewhere nobody asked for, mid-sentence.
        if (digit) jumpToUnit(Number(digit[1]));
        else if (view) setView(view);
        else if (action) action();
        else return;

        // Only after the key is one of ours: the arrows and the page keys
        // otherwise scroll the panel out from under the instructor.
        event.preventDefault();
        repaint();
      });
    }

    function syncControls() {
      for (const button of document.querySelectorAll("[data-view]")) {
        button.setAttribute("aria-pressed", String(button.dataset.view === state.view));
      }
      for (const button of document.querySelectorAll("[data-layer]")) {
        button.setAttribute("aria-pressed", String(state.layers.has(button.dataset.layer)));
      }
    }

    async function load(datasetId) {
      const payload = await fetchScenario(datasetId);
      // Recorded here rather than only in the select's change handler, so the
      // field is true after the first load as well as after a switch.
      setDataset(datasetId);
      setScenario(payload);
      // The DOM is rebuilt exactly once per dataset, and never again for that
      // dataset. Every later state change is a render pass over elements that
      // already exist.
      buildGraph(svg, payload);
      document.getElementById("scenario-name").textContent = payload.name;
      document.getElementById("scenario-description").textContent = payload.description;
      // The beat is re-resolved against the new dataset rather than reset: the
      // marks were cleared with the old theater's edge ids, and the current
      // beat is the only thing that knows what should be marked instead.
      resolveBeat();
      repaint();
    }

    async function boot() {
      const select = document.getElementById("dataset-select");
      const datasets = await fetchDatasets();
      for (const dataset of datasets) {
        const option = document.createElement("option");
        option.value = dataset.id;
        option.textContent = dataset.name;
        select.appendChild(option);
      }
      select.addEventListener("change", () => load(select.value));

      buildControls();
      bindLedger();
      bindKeys();
      setView(VIEWS[0].id);

      // An empty menu means the server loaded no dataset at all, which it
      // refuses to do -- so reaching here is a broken deployment, and it says
      // so rather than quietly requesting `/scenario` with no dataset and
      // drawing whatever the default happens to be.
      if (!datasets.length) throw new Error("/datasets returned nothing to draw");
      await load(datasets[0].id);
    }

    boot();
  </script>
</body>
</html>
